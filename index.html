<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔로운영 3D (베타) · 매장 카운터</title>
<meta name="theme-color" content="#f6ead9">
<meta name="description" content="카운터 안쪽 내 자리에서 둘러보는 1인칭 3D 가계부 시제품">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="솔로운영">
<style>
:root{
  --cream:#fff8ef; --butter:#ffe6a3; --mint:#3fa58a; --mint-l:#bfe9dc; --apricot:#ffc9a3; --coral:#ef8a74; --coral-d:#d9674f;
  --ink:#4a3b30; --muted:#8f7a69; --line:rgba(120,88,60,.13); --line2:rgba(120,88,60,.22);
  --glass:rgba(255,250,243,.8); --pos:#2f9e78; --neg:#dd5e47;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#f6ead9;color:var(--ink);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.7);box-shadow:0 6px 24px rgba(110,70,40,.12)}
[hidden]{display:none!important}

#stage{position:fixed;inset:0;opacity:0;transition:opacity .9s ease}
#stage.ready{opacity:1}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
#stage canvas.dragging{cursor:grabbing}

#loader,#fallback{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f6ead9;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
#loader p,#fallback p{font-size:14px;color:var(--muted);text-align:center;line-height:1.6;padding:0 24px}
#fallback b{font-size:16px}
.blob{width:44px;height:44px;border-radius:50%;background:var(--butter);position:relative;animation:bob 1s ease-in-out infinite alternate}
.blob::before,.blob::after{content:"";position:absolute;top:16px;width:6px;height:8px;border-radius:50%;background:var(--ink)}
.blob::before{left:13px}.blob::after{right:13px}
@keyframes bob{to{transform:translateY(-8px) scale(1.04,.96)}}

/* HUD */
#hud{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;pointer-events:none;transition:right .35s}
#hud>*{pointer-events:auto}
.mark{justify-self:start;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink);padding:6px 11px;border-radius:999px;background:rgba(255,250,243,.7)}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px rgba(239,138,116,.22)}
.mark{min-width:0;max-width:100%;letter-spacing:0}.mark b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.mark small{font-size:9.5px;font-weight:600;color:var(--muted);opacity:.75;white-space:nowrap}

/* 크로스헤어 + 안내 칩 */
#xh{position:fixed;left:50%;top:50%;z-index:12;pointer-events:none;transition:opacity .25s}
#xh .ring{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(90,60,40,.15),0 2px 6px rgba(90,60,40,.18);transition:all .22s cubic-bezier(.3,1.6,.5,1);opacity:.75}
#xh .dot{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(90,60,40,.25);transition:all .2s}
#xh.aim .ring{width:44px;height:44px;margin:-22px 0 0 -22px;border-color:var(--coral);border-width:3px;opacity:1;box-shadow:0 0 0 4px rgba(239,138,116,.18)}
#xh.aim .dot{background:var(--coral);transform:scale(1.3)}
#chip{position:absolute;left:0;top:34px;transform:translateX(-50%) translateY(6px) scale(.9);opacity:0;white-space:nowrap;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;background:#fffaf2;color:var(--ink);box-shadow:0 6px 18px rgba(110,70,40,.18);transition:all .22s cubic-bezier(.3,1.5,.5,1)}
#xh.aim #chip{opacity:1;transform:translateX(-50%) scale(1)}
#chip small{font-weight:600;color:var(--coral-d)}
body.panel-open #xh,body.moving #xh{opacity:0}

/* 오브젝트 배지 / 화면 밖 방향 표시 */
#tags,#fx{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.tg{position:absolute;left:0;top:0;will-change:transform;transition:opacity .25s;pointer-events:auto}
.tg .b{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:rgba(255,250,243,.92);font-size:15px;box-shadow:0 3px 10px rgba(110,70,40,.2);animation:float 2.2s ease-in-out infinite}
.tg .e{display:none;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:rgba(255,250,243,.94);font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 12px rgba(110,70,40,.2)}
.tg.edge .b{display:none} .tg.edge .e{display:flex}
.tg.hide{opacity:0;pointer-events:none}
.tg .e i{font-style:normal;color:var(--coral-d);font-size:14px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.ftext{position:absolute;left:0;top:0;font-size:24px;font-weight:800;color:#fff;white-space:nowrap;-webkit-text-stroke:1px rgba(150,80,40,.25);text-shadow:0 3px 0 var(--coral),0 6px 14px rgba(150,80,40,.3);will-change:transform,opacity}
.ftext.cool{text-shadow:0 3px 0 var(--mint),0 6px 14px rgba(40,110,90,.3)}

/* 하단: 퀵 시점 + 사장님 아이콘 */
#bar{position:fixed;z-index:18;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;transition:opacity .3s,right .35s}
#bar>*{pointer-events:auto}
.quick{display:flex;gap:6px;padding:6px;border-radius:18px}
.quick button{height:38px;padding:0 13px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink);transition:background .2s,transform .12s}
.quick button:hover{background:rgba(255,230,163,.6)}
.quick button.on{background:var(--butter);box-shadow:inset 0 -2px 0 rgba(160,110,30,.18)}
.quick button:active{transform:scale(.95)}
#face{width:56px;height:56px;border-radius:50%;background:var(--butter);font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(160,100,30,.25),inset 0 -3px 0 rgba(160,110,30,.18);transition:transform .15s}
#face:active{transform:scale(.92)}
#face.wiggle{animation:wig .6s ease}
@keyframes wig{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
#bubble{position:fixed;z-index:19;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);max-width:250px;padding:12px 14px;border-radius:18px 18px 6px 18px;background:#fffaf2;font-size:13.5px;line-height:1.55;box-shadow:0 8px 24px rgba(110,70,40,.2);opacity:0;transform:translateY(8px) scale(.95);transform-origin:100% 100%;transition:all .25s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#bubble.show{opacity:1;transform:none}
#bubble[data-brief].show{pointer-events:auto;cursor:pointer}
#bubble b{color:var(--coral-d)}
#hint{position:fixed;z-index:17;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);font-size:12.5px;color:var(--ink);background:rgba(255,250,243,.82);padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 12px rgba(110,70,40,.12);pointer-events:none;transition:opacity .5s}
#hint.gone{opacity:0}
body.panel-open #hint{opacity:0}

/* 패널 */
#panel{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 118px);right:16px;bottom:16px;width:360px;border-radius:24px;display:flex;flex-direction:column;background:rgba(255,250,243,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 50px rgba(110,70,40,.22);
  transform:translateX(calc(100% + 30px));opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1.05),opacity .3s}
#panel.open{transform:none;opacity:1}
.grab{display:none}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 8px}
.ptag{display:inline-block;font-size:11px;font-weight:700;color:var(--coral-d);background:rgba(239,138,116,.13);padding:3px 8px;border-radius:999px;margin-bottom:6px}
.phead h2{font-size:19px;font-weight:800}
#pClose{width:36px;height:36px;flex:none;border-radius:12px;background:rgba(120,88,60,.07);font-size:15px}
.pbody{flex:1;overflow:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.card{border-radius:14px;padding:9px 8px 8px;background:#fff;box-shadow:0 2px 8px rgba(110,70,40,.07);min-width:0}
.card:nth-child(1){background:#fff3d6}.card:nth-child(2){background:#ffe9e1}.card:nth-child(3){background:#e5f6ef}
.card span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.card b{display:block;font-size:13px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{margin:6px 0 16px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#e5f6ef,#fff7e2)}
.big span{font-size:12px;color:var(--muted)}
.big b{display:block;font-size:27px;font-weight:800;margin-top:2px}
.big em{font-style:normal;font-size:12px;color:var(--muted)}
.sec{font-size:12px;font-weight:700;color:var(--muted);margin:4px 2px 6px;display:flex;justify-content:space-between}
.rows{background:#fff;border-radius:16px;padding:2px 12px;box-shadow:0 2px 8px rgba(110,70,40,.06)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:8px;min-width:0}
.row .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12px;color:var(--muted);white-space:nowrap}
.row b{font-weight:700;white-space:nowrap}
.row.new{animation:rowin .9s ease}
@keyframes rowin{from{background:rgba(255,230,163,.8)}to{background:transparent}}
.row.total b{font-size:16px;font-weight:800}
.row b.pos{color:var(--pos)} .row b.neg{color:var(--neg)}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-매장{background:#e5f6ef;color:#2c8a6e}.c-배달{background:#ffe9e1;color:#c85a43}.c-예약{background:#efe8fb;color:#7a5fc0}
.empty{font-size:13px;color:var(--muted);padding:14px 0}
.primary{width:100%;margin-top:14px;height:50px;border-radius:16px;background:var(--coral);color:#fff;font-size:15.5px;font-weight:800;box-shadow:inset 0 -3px 0 rgba(150,60,40,.2),0 6px 16px rgba(239,138,116,.3);transition:transform .12s}
.primary:active{transform:scale(.97)}
.form{margin-top:14px;padding:14px;border-radius:18px;background:#fff;box-shadow:0 2px 10px rgba(110,70,40,.08);animation:fin .3s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.form .field{margin-bottom:12px}
.form input{width:100%;height:48px;border-radius:13px;border:2px solid #f1e4d4;background:#fffaf3;padding:0 12px;font-size:18px;font-weight:700;outline:none;transition:border-color .2s}
.form input:focus{border-color:var(--coral)}
.form input.err{border-color:var(--neg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;height:38px;border-radius:11px;background:#f7efe4;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--butter);color:var(--ink);box-shadow:inset 0 -2px 0 rgba(160,110,30,.18)}
.qk{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qk button{height:30px;padding:0 10px;border-radius:9px;background:#f7efe4;font-size:12px;font-weight:700;color:var(--ink)}
.factions{display:flex;gap:8px;margin-top:4px}
.factions button{flex:1;height:46px;border-radius:13px;font-size:15px;font-weight:800}
.factions .save{background:var(--mint);color:#fff;box-shadow:inset 0 -3px 0 rgba(20,80,60,.2)}
.factions .cancel{background:#f7efe4;color:var(--muted)}
.hintp{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55}
.reset{display:block;margin:14px auto 0;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:8px;text-decoration:underline;text-underline-offset:3px}
.reset.warn{color:var(--coral-d)}

.heart{position:absolute;left:0;top:0;font-size:20px;pointer-events:none;opacity:0;will-change:transform,opacity;animation:heartUp var(--d,1.3s) ease-out var(--dl,0s) forwards}
@keyframes heartUp{0%{opacity:0;transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(.3)}18%{opacity:1;transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) translate(-50%,-50%) scale(.85) rotate(var(--r))}}
#catBubble{position:absolute;left:0;top:0;padding:7px 12px;border-radius:16px 16px 16px 6px;background:#fffaf2;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(110,70,40,.18);opacity:0;transition:opacity .2s;will-change:transform}
#catBubble.show{opacity:1}
button,.tg,#hud,#bar{touch-action:manipulation}
.pbody{overscroll-behavior:contain}
body{-webkit-touch-callout:none}
/* 업종 스위처 + 전환 커튼 */
.lt{grid-column:1;grid-row:1;justify-self:start;display:flex;align-items:center;gap:6px;min-width:0}
.twod{display:flex;align-items:center;gap:2px;height:30px;padding:0 11px;border-radius:999px;background:#fff;font-size:12px;font-weight:800;color:var(--ink);text-decoration:none;white-space:nowrap;box-shadow:0 2px 8px rgba(110,70,40,.13)}
.twod em{font-style:normal}
#gameChip{margin-left:0;white-space:nowrap;font-weight:800}
.solo-legal h3{font-size:15px;font-weight:800;margin:2px 0 8px}.solo-legal h4{font-size:13px;font-weight:800;margin:14px 0 4px}.solo-legal p,.solo-legal li{font-size:12.5px;line-height:1.7;color:#6f5c4f;word-break:keep-all}.solo-legal ul{margin:0;padding-left:17px}.solo-legal li{margin:3px 0}
.primary[disabled]{opacity:.45;box-shadow:none;cursor:default}
.lnk{color:#2563eb;font-weight:800;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.arcgrid{display:grid;grid-template-columns:1fr;gap:14px}.arcl img{display:block;width:100%;max-width:210px;height:auto;margin:0 auto;border-radius:14px;box-shadow:0 6px 18px rgba(60,30,90,.25);background:#231a33}
.arcgo{display:block;text-align:center;text-decoration:none;line-height:50px;margin-top:0}.arcr .sec{display:flex;justify-content:space-between;align-items:center}.arcre{height:30px;padding:0 10px;border-radius:9px;background:#fff;border:1px solid var(--line2);font-size:12px;font-weight:800}
.arcr .row.mine{background:#fff3ee;box-shadow:inset 0 0 0 1.5px #f3b4a2}.rkn{display:inline-block;min-width:26px;text-align:center;font-weight:800}
.arcp{display:flex;flex-direction:column;gap:6px;background:#fff6dc;border:1.5px dashed #e6c66a;border-radius:14px;padding:11px 13px;margin:0 0 10px;font-size:13.5px}.arcp div{display:flex;gap:8px}.arcp button{flex:1;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line2);font-weight:800}.arcp .arcok{background:var(--coral);color:#fff;border:0}
@media (min-width:700px){#sm.arcwide .aisheet{width:min(780px,calc(100vw - 32px))}#sm.arcwide .arcgrid{grid-template-columns:300px 1fr;align-items:start}#sm.arcwide .arcl img{max-width:300px}}
.arcl{display:flex;flex-direction:column;gap:10px;min-width:0}.arcc{display:grid;grid-template-columns:84px minmax(0,1fr);gap:9px 11px;align-items:start;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:10px}.arcc h4{margin:1px 0 4px;font-size:14.5px;line-height:1.3}.arcc .hintp{margin:0}.arcc .arcgo,.arcc .arcn{grid-column:1/-1}.arcc .arcgo{line-height:46px}.arcc .arcn{font-size:12px}
.arcl .arct{width:84px;height:103px;border-radius:11px;overflow:hidden;background:#231a33;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(60,30,90,.22)}.arcl .arct img{width:100%;height:100%;object-fit:cover;margin:0;border-radius:0;box-shadow:none;background:none}.arcl .arct.cz{background:radial-gradient(circle at 28% 18%,#6a4be0 0,#1c1548 56%,#0a0820 100%)}.arcl .arct.cz img{width:58px;height:58px;object-fit:contain}.arcl .arct.cz b{color:#ffe27a;font-size:10.5px;letter-spacing:.6px;line-height:1.2;text-align:center;margin-top:3px}
body.decor #tags,body.decor #xh,body.decor #bar,body.decor #face,body.decor #bubble,body.decor #hint{display:none!important}
#decorUI{position:fixed;z-index:30;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-width:560px;margin:0 auto;background:rgba(255,250,243,.96);border-radius:20px;padding:10px 12px 12px;box-shadow:0 10px 30px rgba(110,70,40,.25)}#decorUI[hidden]{display:none}
#decorUI .dhead{display:flex;align-items:center;gap:8px;font-size:14px}#decorUI .dhead span{margin-left:auto;font-weight:800;color:#a9780d}.ddone{height:36px;padding:0 16px;border-radius:12px;background:var(--coral);color:#fff;font-weight:800}
#decorUI .dhint{margin:2px 0 6px;font-size:12px;color:var(--muted)}#decorUI .dact{display:flex;gap:6px;margin:0 0 8px}#decorUI .dact button.arm{background:#d9553f;color:#fff;border-color:#d9553f}#decorUI .dact button{flex:1;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line2);font-size:12.5px;font-weight:800;white-space:nowrap}
.dtray{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}.dtray button{flex:none;width:92px;scroll-snap-align:start;background:#fff;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 1px 4px rgba(110,70,40,.08)}
.dtray i{font-style:normal;font-size:22px;line-height:1.15}.dtray b{font-size:12px;white-space:nowrap}.dtray em{font-style:normal;font-size:11px;font-weight:800;color:#a9780d;white-space:nowrap}.dtray .own em{color:#2c8a6e}.dtray .no{opacity:.45}
.gbar{height:9px;border-radius:5px;background:#f1e7d8;overflow:hidden;margin:7px 0 2px}.gbar i{display:block;height:100%;border-radius:5px;background:#f2b63c;transition:width .5s}
.goalmini{display:block;width:100%;text-align:left;background:#fffaf3;border-radius:12px;padding:9px 12px;margin:0 0 10px;font-size:12.5px;font-weight:700;box-shadow:0 1px 4px rgba(110,70,40,.06)}.goalmini span{display:flex;justify-content:space-between}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:90;pointer-events:none;border-radius:2px;animation:conffall 1.6s ease-in forwards}@keyframes conffall{to{transform:translateY(106vh) rotate(540deg);opacity:.6}}
#smAd{margin:4px 18px 18px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(110,70,40,.08)}#smAd[hidden]{display:none}
#smAd .adhead{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;background:#f8f4ee;font-size:11px;font-weight:800;color:#6f5c4f}#smAd .adhead span:last-child{font-weight:600;color:#a39488}

const parts = [];
function burstMoney(amount) {
  const origin = V3(0.42, COUNTER_TOP + 0.16, -0.28);
  const nC = 8 + Math.min(10, Math.floor(amount / 40000)), nB = 2 + Math.min(5, Math.floor(amount / 90000));
  const spawn = (geo, mat, half, k) => {
    const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.position.copy(origin).add(V3((Math.random() - 0.5) * 0.08, 0, (Math.random() - 0.5) * 0.06));
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3); scene.add(m);
    parts.push({ m, half, k, v: V3((Math.random() - 0.65) * 1.3, 1.9 + Math.random() * 1.1, 0.25 + Math.random() * 0.7), w: V3((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 16), age: 0, life: 2 + Math.random() * 0.6, settled: false });
  };
  for (let i = 0; i < nC; i++) spawn(coinGeo, goldM, 0.0045, 'coin');
  for (let i = 0; i < nB; i++) spawn(billGeo, billM, 0.002, 'bill');
  spawn(receiptGeo, receiptM, 0.0015, 'receipt');
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age += dt;
    if (!p.settled) {
      const light = p.k !== 'coin';
      p.v.y -= 9.8 * (light ? 0.35 : 1) * dt; if (light) p.v.multiplyScalar(1 - 1.3 * dt);
      p.m.position.addScaledVector(p.v, dt);
      p.m.rotation.x += p.w.x * dt; p.m.rotation.y += p.w.y * dt; p.m.rotation.z += p.w.z * dt;
      const q = p.m.position, onTop = q.x > CB.x0 - 0.07 && q.x < CB.x1 + 0.07 && q.z > CB.z0 - 0.06 && q.z < CB.z1 + 0.06;
      const gy = (onTop ? COUNTER_TOP : 0) + p.half;
      if (q.y < gy && p.v.y < 0 && (!onTop || q.y > COUNTER_TOP - 0.12)) {
        q.y = gy; p.v.y *= -0.35; p.v.x *= 0.55; p.v.z *= 0.55; p.w.multiplyScalar(0.5);
        if (Math.abs(p.v.y) < 0.3) { p.settled = true; p.m.rotation.x = 0; p.m.rotation.z = 0; }
      }
    }
    if (p.age > p.life) { const s = 1 - (p.age - p.life) / 0.35; if (s <= 0) { scene.remove(p.m); parts.splice(i, 1); continue; } p.m.scale.setScalar(s); }
  }
}

const an = { door: 0, df: 0, dt: 0, ds: 0, drw: 0, wf: 0, wt: 0, ws: 0 }; let sparkleAt = 0;
function fridgeOpen(on) { an.df = an.door; an.dt = on ? 1 : 0; an.ds = performance.now(); if (on) sparkleAt = performance.now() + (RM ? 0 : 380); }
function drawerOpen(on) { an.wf = an.drw; an.wt = on ? 1 : 0; an.ws = performance.now(); }
function stepAnims(now) {
  const op = an.dt > an.df, td = Math.min(1, (now - an.ds) / (op ? 800 : 600));
  an.door = an.df + (an.dt - an.df) * (op ? easeBack(td) : easeIO(td));
  const a = 1.9 * an.door; doorL.rotation.y = -a; doorR.rotation.y = a;
  const lit = THREE.MathUtils.clamp(an.door, 0, 1); fridgeLight.intensity = 3.5 * lit; fInner.emissiveIntensity = 0.45 * lit;
  if (sparkleAt && now >= sparkleAt) { fridgeItems.forEach((g, j) => { g.userData.popT = now + j * 55; }); sparkleAt = 0; }
  const tw = Math.min(1, (now - an.ws) / 650);
  an.drw = an.wf + (an.wt - an.wf) * (an.wt > an.wf ? easeBack(tw) : easeIO(tw));
  drawer.position.z = 0.17 + 0.17 * an.drw;
  fridgeItems.forEach(g => {
    const u = g.userData; let s = 1, ei = 0; g.position.y = u.baseY;
    if (u.spawnT > 0) {
      const t = (now - u.spawnT) / 650;
      if (t >= 1) { u.spawnT = -1; u.popT = now; }
      else { const e = Math.max(0, t); s = Math.max(0.001, easeBack(e)); g.position.y = u.baseY + (1 - easeOut(e)) * 0.25; ei = 0.6 * (1 - e); }
    }
    if (u.spawnT < 0 && u.popT > 0) {
      const t = (now - u.popT) / 520;
      if (t >= 0 && t < 1) { s = 1 + 0.22 * Math.sin(Math.PI * t); ei = 0.7 * (1 - t); g.position.y = u.baseY + 0.04 * Math.sin(Math.PI * t); }
      else if (t >= 1) u.popT = -1;
    }
    g.scale.setScalar(s); u.mat.emissiveIntensity = ei;
  });
}
