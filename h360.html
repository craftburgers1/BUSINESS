<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360px 폭 검사 하네스 (임시)</title>
<style>
  body{margin:0;padding:12px;font:13px/1.5 system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .col{background:#1e293b;padding:8px;border-radius:10px}
  .col h3{margin:0 0 6px;font-size:13px;color:#93c5fd}
  iframe{width:360px;height:720px;border:1px solid #475569;background:#fff;border-radius:8px}
  pre{white-space:pre-wrap;color:#a7f3d0}
</style>
</head>
<body>
<h2 style="margin:0 0 10px;font-size:15px">360×720 폭 검사</h2>
<div class="row">
  <div class="col"><h3>index.html (3D)</h3><iframe id="f3d" src="./?h=1"></iframe></div>
  <div class="col"><h3>2d.html (가계부)</h3><iframe id="f2d" src="2d.html?h=1"></iframe></div>
</div>
<pre id="out">측정 중…</pre>
<script>
function measure(id){
  const f = document.getElementById(id), d = f.contentDocument, w = f.contentWindow;
  if(!d || !d.documentElement) return id+': 문서 없음';
  const de = d.documentElement;
  let worst = null;
  d.querySelectorAll('body *').forEach(el=>{
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    if (r.right > 360.5) { const over = Math.round(r.right - 360); if (!worst || over > worst.over) worst = {over, tag: el.tagName+(el.id?'#'+el.id:''), cls: (el.className||'').toString().slice(0,40)}; }
  });
  const header = d.querySelector('header');
  const hr = header ? header.getBoundingClientRect() : null;
  return id + ': viewport=' + w.innerWidth +
    ' scrollW=' + Math.max(de.scrollWidth, d.body.scrollWidth) +
    ' clientW=' + de.clientWidth +
    ' 넘침=' + (Math.max(de.scrollWidth, d.body.scrollWidth) - de.clientWidth) +
    (hr ? ' | header: ' + Math.round(hr.width) + 'px right=' + Math.round(hr.right) + ' scrollW=' + header.scrollWidth : '') +
    (worst ? '\n   최대 이탈: +' + worst.over + 'px ' + worst.tag + ' .' + worst.cls : '\n   넘친 요소 없음');
}
function run(){
  const lines = [measure('f3d'), measure('f2d')];
  document.getElementById('out').textContent = lines.join('\n');
}
setTimeout(run, 6000);
setTimeout(run, 12000);
</script>
</body>
</html>
