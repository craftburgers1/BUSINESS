<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>360 검증 하네스(임시)</title>
<style>
  body{margin:0;background:#20242a;font:12px/1.4 system-ui,sans-serif;color:#c9d3df;display:flex;gap:16px;padding:12px;align-items:flex-start}
  .cap{font-size:11px;color:#8ea3b8;margin-bottom:4px}
  iframe{display:block;border:1px solid #3a4250;border-radius:10px;background:#000}
  #mob{width:360px;height:720px}
</style>
</head>
<body>
<div><div class="cap" id="mc">mobile 360x720</div><iframe id="mob" src="./index.html?frame=mobile"></iframe></div>
<script>document.getElementById('mc').textContent='mobile '+document.getElementById('mob').clientWidth+'x'+document.getElementById('mob').clientHeight;</script>
</body>
</html>
